name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: false

jobs:
  build-macos:
    name: Build macOS
    strategy:
      matrix:
        include:
          - runner: macos-14  # Apple Silicon (ARM64)
            arch: arm64
          - runner: macos-13  # Intel (x64)
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build for macOS ${{ matrix.arch }}
        run: |
          echo "Building for macOS ${{ matrix.arch }} on $(uname -m)"
          pkg . --targets node18-macos-${{ matrix.arch }} --out-path dist/macos --compress GZip

      - name: Verify binary architecture
        run: |
          if [ -f "dist/macos/focal-deploy-${{ matrix.arch }}" ]; then
            file dist/macos/focal-deploy-${{ matrix.arch }}
            chmod +x dist/macos/focal-deploy-${{ matrix.arch }}
            dist/macos/focal-deploy-${{ matrix.arch }} --version || echo "Binary test failed, but continuing..."
          else
            echo "Error: Binary not found at dist/macos/focal-deploy-${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focal-deploy-macos-${{ matrix.arch }}
          path: dist/macos/focal-deploy-${{ matrix.arch }}
          retention-days: 7

  build-linux:
    name: Build Linux
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build for Linux ${{ matrix.arch }}
        run: |
          echo "Building for Linux ${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # For ARM64, we need to rebuild native modules
            npm rebuild --arch=arm64
          fi
          pkg . --targets node18-linux-${{ matrix.arch }} --out-path dist/linux --compress GZip

      - name: Verify binary
        run: |
          if [ -f "dist/linux/focal-deploy-${{ matrix.arch }}" ]; then
            file dist/linux/focal-deploy-${{ matrix.arch }}
            chmod +x dist/linux/focal-deploy-${{ matrix.arch }}
            # ARM64 binaries won't run on x64 runners, so we only check x64
            if [ "${{ matrix.arch }}" = "x64" ]; then
              dist/linux/focal-deploy-${{ matrix.arch }} --version || echo "Binary test failed, but continuing..."
            fi
          else
            echo "Error: Binary not found at dist/linux/focal-deploy-${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focal-deploy-linux-${{ matrix.arch }}
          path: dist/linux/focal-deploy-${{ matrix.arch }}
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build for Windows x64
        run: |
          echo "Building for Windows x64"
          pkg . --targets node18-win-x64 --out-path dist/windows --compress GZip

      - name: Verify binary
        run: |
          if (Test-Path "dist/windows/focal-deploy.exe") {
            dist/windows/focal-deploy.exe --version
          } else {
            Write-Error "Binary not found at dist/windows/focal-deploy.exe"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focal-deploy-windows-x64
          path: dist/windows/focal-deploy.exe
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R release-artifacts

      - name: Create checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/**/*
            release-artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
